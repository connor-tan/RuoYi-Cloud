# Tomcat
server:
  port: 9201

# Spring
spring: 
  application:
    # 应用名称
    name: tower-system
  profiles:
    # 环境配置
    active: ${spring.profiles.active}
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${tower.nacos.server}:${tower.nacos.port}
        namespace: ${tower.nacos.namespace}
      config:
        # 配置中心地址
        server-addr: ${tower.nacos.server}:${tower.nacos.port}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        namespace: ${tower.nacos.namespace}
      username: nacos
      password: nacos
