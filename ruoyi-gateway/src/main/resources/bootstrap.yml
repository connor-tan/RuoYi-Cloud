# Tomcat
server:
  port: 8080

# Spring
spring: 
  application:
    # 应用名称
    name: tower-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${tower.nacos.server}:${tower.nacos.port}
        namespace: ${tower.nacos.namespace}
      config:
        # 配置中心地址
        server-addr: ${tower.nacos.server}:${tower.nacos.port}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        namespace: ${tower.nacos.namespace}
      username: nacos
      password: nacos
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: ${tower.sentinel.server}:${tower.sentinel.port}
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: ${tower.nacos.server}:${tower.nacos.port}
            dataId: sentinel-ruoyi-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
            username: nacos
            password: nacos
